services:
  jenkins:
    build: .
    image: jenkins-docker:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/jenkins-workspace:/srv/jenkins-workspace
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true -Djenkins.model.Jenkins.workspacesDir=/srv/jenkins-workspace/$${ITEM_FULL_NAME} -Dhudson.model.DirectoryBrowserSupport.CSP="sandbox; default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline';"
      - TZ=Europe/Madrid

volumes:
  jenkins_home:
